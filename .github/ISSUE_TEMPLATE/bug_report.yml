name: Rapport de bug
description: Signaler un problème avec Unitae
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug.
        **Pour les vulnérabilités de sécurité**, consultez [SECURITY.md](https://github.com/Unitae/unitae/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Description claire et concise du problème.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Etapes pour reproduire
      description: Les étapes pour reproduire le comportement.
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Observer l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce que vous vous attendiez à voir.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
      description: Ce qui s'est réellement passé.
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Version de Node.js
      placeholder: "22.0.0"

  - type: input
    id: browser
    attributes:
      label: Navigateur
      placeholder: "Chrome 130, Firefox 132, Safari 18..."

  - type: dropdown
    id: deployment
    attributes:
      label: Type de déploiement
      options:
        - Développement local (docker-compose)
        - Docker
        - Kubernetes

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Logs pertinents (console du navigateur, logs du serveur).
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Contexte additionnel
      description: Tout autre contexte utile (captures d'écran, configuration, etc.).
