services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-unitae}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-unitae}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-unitae} -d ${DB_NAME:-unitae}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks:
      - app
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${UNITAE_MIGRATE_IMAGE:-ghcr.io/unitae/unitae/migrate:latest}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  web:
    image: ${UNITAE_WEB_IMAGE:-ghcr.io/unitae/unitae:latest}
    restart: unless-stopped
    # When fronting the app with the `caddy` service below, remove this public port
    # mapping so the app is only reachable through the TLS-terminating proxy.
    ports:
      - '${UNITAE_WEB_PORT:-8080}:8080'
    env_file: .env
    environment:
      PORT: ${UNITAE_WEB_PORT:-8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app
    volumes:
      - unitae_content:/app/content:rw
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional hardened reverse proxy: automatic HTTPS + TLS termination for self-hosters.
  # See docker/Caddyfile.example for setup. Uncomment this block (and copy the example
  # to docker/Caddyfile) to serve Unitae over HTTPS with the app's security headers.
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     web:
  #       condition: service_healthy
  #   networks:
  #     - app

  worker:
    image: ${UNITAE_WORKER_IMAGE:-ghcr.io/unitae/unitae/worker:latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9090/']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app:

volumes:
  postgres_data:
  redis_data:
  unitae_content:
  # Uncomment alongside the `caddy` service above.
  # caddy_data:
  # caddy_config:
